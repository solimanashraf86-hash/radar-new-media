<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 رادار NEW MEDIA - منظومة رصد الفرص والعملاء</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --gold: #f59e0b;
      --hot: #ef4444;
      --strong: #f97316;
      --watch: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.25rem; color: var(--gold); margin: 0; }
    .status-badge { font-size: 0.85rem; color: #10b981; }
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .column-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .column-title.hot { color: var(--hot); }
    .column-title.strong { color: var(--strong); }
    .column-title.watch { color: var(--watch); }
    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card.hot { border-right: 4px solid var(--hot); }
    .card.strong { border-right: 4px solid var(--strong); }
    .card.watch { border-right: 4px solid var(--watch); }
    .card-title { font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
    .card-desc { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4; }
    .meta-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
    select {
      width: 100%;
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🎯 رادار NEW MEDIA</h1>
  <div class="status-badge">● متصل وجاهز للرصد</div>
</header>

<div class="pipeline-grid">
  <div>
    <div class="column-title hot">🔥 عملاء جاهزون (HOT)</div>
    <div id="hot-container"></div>
  </div>
  <div>
    <div class="column-title strong">🟠 عملاء محتملون (STRONG)</div>
    <div id="strong-container"></div>
  </div>
  <div>
    <div class="column-title watch">👀 تحت المراقبة (WATCH)</div>
    <div id="watch-container"></div>
  </div>
</div>

<script>
  const statuses = ["جديد", "تم التواصل", "رد", "مهتم", "تفاوض", "تم البيع", "خسرنا العميل", "تجاهل"];

  function updateStatus(id, newStatus) {
    localStorage.setItem('lead_status_' + id, newStatus);
  }

  async function loadLeads() {
    try {
      const res = await fetch('data.json');
      const leads = await res.json();
      
      leads.forEach(lead => {
        const savedStatus = localStorage.getItem('lead_status_' + lead.id) || lead.status || 'جديد';
        const card = document.createElement('div');
        card.className = `card ${lead.category.toLowerCase()}`;
        
        let optionsHtml = statuses.map(s => `<option value="${s}" ${s === savedStatus ? 'selected' : ''}>الحالة: ${s}</option>`).join('');

        card.innerHTML = `
          <div class="card-title">${lead.title}</div>
          <div class="card-desc">${lead.snippet}</div>
          <div class="meta-row">
            <span>المصدر: ${lead.source}</span>
            <span>الحداثة: ${lead.freshness_text}</span>
          </div>
          <select onchange="updateStatus('${lead.id}', this.value)">
            ${optionsHtml}
          </select>
        `;

        const target = lead.category === 'HOT' ? 'hot-container' : (lead.category === 'STRONG' ? 'strong-container' : 'watch-container');
        document.getElementById(target).appendChild(card);
      });
    } catch (err) {
      console.error("خطأ في قراءة البيانات:", err);
    }
  }

  loadLeads();
</script>
</body>
</html>
